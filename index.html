<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 - Page Not Found</title>

  <meta name="robots" content="noindex, nofollow" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .error-content {
      max-width: 600px;
    }

    .error-code {
      margin: 0;
      font-size: 110px;
      line-height: 1;
      font-weight: 700;
      color: #222222;
    }

    .error-title {
      margin: 25px 0 10px;
      font-size: 28px;
      font-weight: 600;
      color: #222222;
    }

    .error-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: #666666;
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 80px;
      }

      .error-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">
    <div class="error-content">
      <h1 class="error-code">404</h1>

      <h2 class="error-title">
        Page Not Found
      </h2>

      <p class="error-text">
        The requested page could not be found.
      </p>
    </div>
  </main>

</body>
</html>
